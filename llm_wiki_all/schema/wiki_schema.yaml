# LLM Wiki Schema

version: 1
source: outputs/all_results.json

layers:
  raw:
    description: Original and extracted source material used by the wiki.
    files:
      - raw/source_records.json
      - raw/manifest.json
      - raw/papers.csv
      - raw/tasks.csv
      - raw/datasets.csv
      - raw/dataset_uses.csv
  pages:
    description: Human-readable Markdown wiki pages generated from the extracted records.
    directories:
      - pages/papers
      - pages/tasks
      - pages/datasets
      - pages/dataset_uses
  schema:
    description: Knowledge organization rules for entities, relations, and page templates.

entities:
  Paper:
    id: paper_id
    properties:
      - paper_file
      - title
    page: pages/papers/{paper_slug}.md
  Task:
    id: task_id
    properties:
      - task_description
      - task_tags
      - paper_id
    page: pages/tasks/{task_slug}.md
  Dataset:
    id: dataset_id
    properties:
      - db_title
      - aliases
      - links
      - descriptions
    page: pages/datasets/{dataset_slug}.md
  DatasetUse:
    id: dataset_use_id
    properties:
      - paper_id
      - task_id
      - dataset_id
      - db_description
      - db_link
    page: pages/dataset_uses/{dataset_use_slug}.md

relations:
  HAS_TASK:
    from: Paper
    to: Task
  USES_DATASET:
    from: Task
    to: Dataset
  HAS_DATASET_USE:
    from: Task
    to: DatasetUse
  DESCRIBES_DATASET:
    from: DatasetUse
    to: Dataset
  MENTIONS_TAG:
    from: Task
    to: tag string

page_rules:
  Paper:
    purpose: Summarize one source paper, its extracted tasks, and used datasets.
  Task:
    purpose: Describe one research task or intent and list supporting datasets.
  Dataset:
    purpose: Aggregate all mentions/usages of the same real dataset across papers.
  DatasetUse:
    purpose: Preserve paper-specific dataset role and evidence context.

  R&DStage:
    id: stage_name
    properties:
      - stage_name
      - description
    page: pages/stages/{stage_slug}.md

stage_annotation:
  Task:
    property: rd_stages
    meaning: R&D stages covered by the paper-level research task.
  DatasetUse:
    property: rd_stages
    meaning: R&D stages supported by this dataset in the context of the paper task.

